<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Total Connect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">TOTAL CONNECT</span>
      </div>
      <div class="header-right">
        <button class="icon-btn-text" id="btn-view-toggle" title="Toggle List/Grid View">
          <span id="view-toggle-icon">🔲</span> <span class="btn-label" id="view-toggle-label">Grid</span>
        </button>
        <button class="icon-btn-text" id="btn-settings" title="Settings">
          ⚙️ <span class="btn-label">Settings</span>
        </button>
        <button class="add-conn-btn" id="btn-add-conn" title="Add new cloud or FTP connection">
          ➕ <span class="add-conn-text">+ Add Connection</span>
        </button>
        <div class="status-badge" id="connection-status">Online</div>
      </div>
    </header>

    <!-- Mobile Tab Switcher (< 768px) -->
    <nav class="mobile-tabs" id="mobile-tabs">
      <button class="tab-btn active" id="tab-left" data-tab="left">
        📂 Left Pane
      </button>
      <button class="tab-btn" id="tab-right" data-tab="right">
        📁 Right Pane
      </button>
    </nav>

    <!-- Main Dual-Pane Area -->
    <main class="panes-container">
      <!-- Left Pane -->
      <section class="pane active" id="pane-left" data-pane="left">
        <div class="pane-toolbar">
          <div class="remote-picker">
            <label for="remote-select-left">Remote:</label>
            <select id="remote-select-left" data-pane="left">
              <option value="local">Local Filesystem</option>
            </select>
          </div>

          <div class="address-bar-wrapper">
            <button class="btn-icon" id="btn-up-left" data-pane="left" title="Parent Directory">⬆</button>
            <div class="address-bar" id="address-bar-left" data-pane="left">
              <div class="breadcrumbs-container" id="breadcrumbs-left" data-pane="left"></div>
              <input type="text" id="path-input-left" class="path-edit-input hidden" data-pane="left" placeholder="e.g. gdrive:folder or /var/log">
            </div>
            <button class="btn-icon" id="btn-edit-path-left" data-pane="left" title="Edit Path Directly">✏️</button>
          </div>

          <div class="filter-bar">
            <input type="text" id="filter-input-left" class="filter-input" data-pane="left" placeholder="🔍 Quick filter files...">
          </div>
        </div>

        <div class="table-header" id="table-header-left">
          <span class="col-check"><input type="checkbox" id="select-all-left" data-pane="left"></span>
          <span class="col-name">Name</span>
          <span class="col-size">Size</span>
          <span class="col-mtime">Modified</span>
        </div>

        <div class="file-list list-view" id="file-list-left" data-pane="left">
          <!-- Populated by JS -->
        </div>

        <div class="pane-footer" id="pane-footer-left">
          0 items
        </div>
      </section>

      <!-- Right Pane -->
      <section class="pane" id="pane-right" data-pane="right">
        <div class="pane-toolbar">
          <div class="remote-picker">
            <label for="remote-select-right">Remote:</label>
            <select id="remote-select-right" data-pane="right">
              <option value="local">Local Filesystem</option>
            </select>
          </div>

          <div class="address-bar-wrapper">
            <button class="btn-icon" id="btn-up-right" data-pane="right" title="Parent Directory">⬆</button>
            <div class="address-bar" id="address-bar-right" data-pane="right">
              <div class="breadcrumbs-container" id="breadcrumbs-right" data-pane="right"></div>
              <input type="text" id="path-input-right" class="path-edit-input hidden" data-pane="right" placeholder="e.g. gdrive:folder or /var/log">
            </div>
            <button class="btn-icon" id="btn-edit-path-right" data-pane="right" title="Edit Path Directly">✏️</button>
          </div>

          <div class="filter-bar">
            <input type="text" id="filter-input-right" class="filter-input" data-pane="right" placeholder="🔍 Quick filter files...">
          </div>
        </div>

        <div class="table-header" id="table-header-right">
          <span class="col-check"><input type="checkbox" id="select-all-right" data-pane="right"></span>
          <span class="col-name">Name</span>
          <span class="col-size">Size</span>
          <span class="col-mtime">Modified</span>
        </div>

        <div class="file-list list-view" id="file-list-right" data-pane="right">
          <!-- Populated by JS -->
        </div>

        <div class="pane-footer" id="pane-footer-right">
          0 items
        </div>
      </section>
    </main>

    <!-- Bottom Action Toolbar -->
    <footer class="action-toolbar">
      <button class="action-btn primary" id="btn-action-copy">
        <span class="btn-icon-label">📋</span> Copy
      </button>
      <button class="action-btn warning" id="btn-action-move">
        <span class="btn-icon-label">🚚</span> Move
      </button>
      <button class="action-btn info" id="btn-action-mkdir">
        <span class="btn-icon-label">➕</span> New Folder
      </button>
      <button class="action-btn danger" id="btn-action-delete">
        <span class="btn-icon-label">🗑️</span> Delete
      </button>
      <button class="action-btn secondary" id="btn-action-refresh">
        <span class="btn-icon-label">🔄</span> Refresh
      </button>
      <button class="action-btn secondary" id="btn-action-remotes">
        <span class="btn-icon-label">🌐</span> Manage Remotes
      </button>
    </footer>

    <!-- Toasts / Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modals -->

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="wizard-header">
          <h3>⚙️ Preferences &amp; Settings</h3>
          <button class="modal-close-btn" id="btn-close-settings" aria-label="Close">✕</button>
        </div>
        <div class="settings-body">
          <div class="form-group checkbox-group" style="margin-top: 10px;">
            <label class="checkbox-label">
              <input type="checkbox" id="setting-show-hidden">
              <span>Show Hidden Files (dotfiles like <code>.git</code>, <code>.env</code>)</span>
            </label>
          </div>
          <div class="form-group" style="margin-top: 15px;">
            <label for="setting-default-view">Default Pane View Mode</label>
            <select id="setting-default-view" class="modal-select">
              <option value="list">Detailed List View</option>
              <option value="grid">Grid / Card View</option>
            </select>
          </div>
        </div>
        <div class="modal-actions" style="margin-top: 20px;">
          <button class="action-btn primary" id="btn-save-settings">Save Preferences</button>
          <button class="action-btn secondary" id="btn-cancel-settings">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Mkdir Modal -->
    <div id="mkdir-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <h3>Create New Directory</h3>
        <p id="mkdir-target-info">Target path:</p>
        <input type="text" id="mkdir-input" class="modal-input" placeholder="Directory name">
        <div class="modal-actions">
          <button class="action-btn primary" id="btn-confirm-mkdir">Create</button>
          <button class="action-btn secondary" id="btn-cancel-mkdir">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Remote Management Modal -->
    <div id="remote-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="wizard-header">
          <h3>🌐 Configured Remotes</h3>
          <button class="modal-close-btn" id="btn-close-remote-modal" aria-label="Close">✕</button>
        </div>
        <div class="remote-list-container" id="remote-list-modal-body">
          <!-- Rendered dynamically -->
        </div>
        <div class="modal-actions" style="margin-top: 15px;">
          <button class="action-btn info" id="btn-remote-modal-add">➕ Add Connection</button>
          <button class="action-btn secondary" id="btn-remote-modal-close">Close</button>
        </div>
      </div>
    </div>

    <!-- Connection Wizard Modal -->
    <div id="wizard-modal" class="modal-backdrop hidden">
      <div class="modal-card wizard-card">
        <div class="wizard-header">
          <h3 id="wizard-title">⚡ Add New Connection</h3>
          <button class="modal-close-btn" id="btn-close-wizard" aria-label="Close">✕</button>
        </div>

        <form id="wizard-form">
          <div class="form-group" id="wizard-type-group">
            <label for="wizard-type">Storage Type</label>
            <select id="wizard-type" class="modal-select">
              <option value="ftp">FTP (File Transfer Protocol)</option>
              <option value="sftp">SFTP / SSH (Secure File Transfer Protocol)</option>
              <option value="webdav">WebDAV / Nextcloud</option>
              <option value="s3">Amazon S3 / MinIO / Cloudflare R2</option>
              <option value="b2">Backblaze B2</option>
              <option value="drive">Google Drive</option>
              <option value="mega">MEGA</option>
              <option value="dropbox">Dropbox</option>
              <option value="onedrive">Microsoft OneDrive</option>
              <option value="custom">⚡ Custom / Raw Config Mode (Advanced)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="wizard-name">Connection Name</label>
            <input type="text" id="wizard-name" class="modal-input" placeholder="e.g. MyGoogleDrive, MySFTP, BackupB2" required>
          </div>

          <!-- Dynamic Parameter Fields -->
          <div id="wizard-dynamic-fields" class="wizard-fields-container">
            <!-- Rendered by JS -->
          </div>

          <div class="modal-actions">
            <button type="button" class="action-btn secondary" id="btn-cancel-wizard">Cancel</button>
            <button type="submit" class="action-btn primary" id="wizard-submit-btn">Save &amp; Connect</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
